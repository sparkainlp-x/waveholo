[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wave-hologram"
version = "0.1.5"
description = "Off-axis digital holography with measured focus: record, reconstruct, find the focus distance."
readme = "README.md"
requires-python = ">=3.9"
license = "AGPL-3.0-only"
authors = [{ name = "Jean-François Brisson" }]
keywords = ["digital-holography", "angular-spectrum", "off-axis-holography", "autofocus"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dhm = ["Pillow>=9.0.0"]
notebook = ["jupyter", "nbconvert", "ipykernel"]
test = [
    "coverage[toml]>=7.4.0",
    "playwright>=1.44.0",
    "Pillow>=9.0.0",
    "pytest>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/sparkainlp-x/waveholo"
Documentation = "https://sparkainlp-x.github.io/waveholo/game/"
Repository = "https://github.com/sparkainlp-x/waveholo"
Issues = "https://github.com/sparkainlp-x/waveholo/issues"

[tool.setuptools]
py-modules = ["wave_hologram"]

[tool.coverage.run]
source = ["wave_hologram"]
omit = ["tests/*", "scripts/*", "docs/*"]

[tool.coverage.report]
show_missing = true
fail_under = 85
