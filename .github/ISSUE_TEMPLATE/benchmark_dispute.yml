name: Benchmark dispute
description: Report a reproducible disagreement with a benchmark result
title: "[BENCHMARK DISPUTE] "
labels: ["benchmark"]
body:
  - type: input
    id: protocol
    attributes:
      label: Protocol version, result bundle, and commit SHA
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Exact config, seed, command, and environment
    validations:
      required: true
  - type: textarea
    id: difference
    attributes:
      label: Metric difference, uncertainty, and output checksums
    validations:
      required: true
