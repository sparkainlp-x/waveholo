name: Replication request
description: Request an independent reproduction of a documented result
title: "[REPLICATION] "
labels: ["replication"]
body:
  - type: input
    id: result
    attributes:
      label: Result/protocol version to reproduce
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment, exact command, and available data
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome, logs, and checksums
    validations:
      required: true
