name: CI with uv & Codecov

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-matrix:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-suffix: py${{ matrix.python-version }}
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --all-extras --python ${{ matrix.python-version }}
      - run: |
          uv run coverage run -m unittest discover -s tests -v
          uv run coverage report -m
          uv run coverage xml -o coverage.xml
      - run: uv run python scripts/make_game_frames.py --check
      - uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  browser-wasm-test:
    name: Headless Pyodide WASM test
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.44.0-jammy
    steps:
      - uses: actions/checkout@v4
      - run: pip install --upgrade pip && pip install -e .[test]
      - run: python -m unittest tests/test_pyodide_browser.py -v
