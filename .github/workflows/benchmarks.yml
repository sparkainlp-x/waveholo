name: Scheduled synthetic benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - run: |
          set +e
          make benchmark CONFIG=benchmarks/configs/waveholo_nominal.yaml OUTPUT=/tmp/waveholo-nominal
          status=$?
          set -e
          test "$status" -eq 0 -o "$status" -eq 2
      - uses: actions/upload-artifact@v4
        with:
          name: waveholo-nominal-${{ github.run_id }}
          path: /tmp/waveholo-nominal
          if-no-files-found: error
